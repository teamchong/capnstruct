name: Publish to npm

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Build, Test & Publish to npm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Upgrade npm for OIDC Trusted Publishing
        run: npm install -g npm@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build, test, and verify bundle size budgets
        run: |
          pnpm run build
          pnpm test
          pnpm run size

      - name: Publish to npm with OIDC provenance (if version not yet published)
        env:
          NPM_CONFIG_PROVENANCE: 'true'
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          PUBLISHED_VERSION=$(npm view "capnstruct@${PKG_VERSION}" version 2>/dev/null || true)
          if [ "$PUBLISHED_VERSION" = "$PKG_VERSION" ]; then
            echo "capnstruct@${PKG_VERSION} is already published on npm; skipping."
            exit 0
          fi
          echo "Publishing capnstruct@${PKG_VERSION} to npm..."
          npm publish --provenance --access public
